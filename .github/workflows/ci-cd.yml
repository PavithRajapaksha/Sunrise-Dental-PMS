name: CI/CD Pipeline

# WHEN this workflow runs:
# - Every push to dev or main
# - Every pull request that targets dev or main
on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:

  # ---------- CONTINUOUS INTEGRATION ----------
  # This job always runs. It proves the code builds and the tests pass.
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build the project and run all tests
        run: mvn -B clean verify

      - name: Save the built WAR file
        uses: actions/upload-artifact@v4
        with:
          name: sunrise-dental-pms-war
          path: target/*.war

  # ---------- CONTINUOUS DEPLOYMENT ----------
  # This job only runs when build-and-test succeeds AND the change
  # landed on main (i.e. a pull request from dev was merged).
  # It packages the app and publishes it as a GitHub Release,
  # which stands in for "deploying" a new version.
  release:
    name: Package and Release
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Package the WAR file
        run: mvn -B clean package -DskipTests

      - name: Publish a GitHub Release with the WAR attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: target/*.war
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
